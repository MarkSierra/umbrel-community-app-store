manifestVersion: 1
id: marksierra-bitcoinmonetaryview
storage:
  dataRoot: data
category: bitcoin
name: Monetary View
version: "0.3.5"
tagline: See how much spam your node stores
icon: https://raw.githubusercontent.com/MarkSierra/umbrel-community-app-store/main/marksierra-bitcoinmonetaryview/icon.svg
description: >-
  Monetary View analyses the blocks and the UTXO set of your own Bitcoin node with the Monetary Node spam
  rules: inscriptions, oversized OP_RETURN outputs, fake-key multisig (Stamps) and oversized scriptSigs.


  It shows how much spam your node stores per block and over the whole chain, how much storage a Monetary
  Node would save, and how much spam sits in the current UTXO set. A whole-chain estimate appears within
  minutes; the exact figures follow as the history scan runs. You can look up any block, analyse a period of
  your choice and share a summary card.


  Monetary View is an independent project, not affiliated with or endorsed by the Monetary Node project;
  it uses its published spam rules unchanged.


  Strictly read-only: the app only reads blocks through a whitelist of read-only RPC calls, never changes
  your node or its files, and makes no external requests. Works with Umbrel's Bitcoin Node and with Bitcoin
  Knots. The dashboard is available in English, German, Spanish, French and Polish.


  The scan results are rebuilt from your node if needed, so they are left out of Umbrel backups; your
  settings are kept.
developer: Mark Sierra
